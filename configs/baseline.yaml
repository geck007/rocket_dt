# Baseline digital-twin configuration.
#
# Single source of truth:
#   airframe        -> the .ork file (+ the explicit overrides below, each logged at build time)
#   motor           -> openMotor CSV (thrust, grain mass), .ric (grain geometry), .eng (loaded mass, case size)
#   everything else -> this file. Settings stored inside the .ork's simulations are NOT used.
# Unknown keys are rejected.

rocket:
  ork: ../data/rocket.ork.zip
  canards: "canards bay body/Trapezoidal Fin Set"
  fin_can:
    enabled: true                       # false = fin can locked to the body
    components: ["motor case transition"]   # this tube and everything attached to it spins
    roll_inertia: 0.026                 # kg m^2, upper-bound estimate (CAD fins + can + 0.6 kg hardware at r = 65 mm)
    bearing:                            # 61820 deep-groove bearing - PLACEHOLDER values until a spin-down test
      coulomb_torque: 0.02              # N m
      viscous_coeff: 1.0e-4             # N m s/rad
  overrides:
    - component: "motor case transition/Trapezoidal Fin Set"
      set: {mass: 0.971425}
      note: "CAD (Fusion 360, Vihaan, 2026-10-29): 4 fins, PA12-CF"

motor:
  burn_data: "../data/csv files as asked.csv"
  grains: "../data/pls work.ric"
  eng: "../data/pls work eng file.eng"
  grain_stack_offset: 0.0               # grain stack centred in the case (assumption)
  grain_spacing: 0.0

launch:
  rail_length: 1.0
  angle_from_vertical_deg: 0.0
  azimuth_deg: 90.0
  altitude_msl: 0.0
  latitude_deg: 28.61

environment:
  wind:
    speed: 2.0
    direction_from_deg: 90.0            # wind FROM the east
    profile: constant
    turbulence: {model: none}

aero:
  canard_vortex:                        # canard tip vortices acting on the fin can (aero.py)
    model: vortex                       # none | vortex
    strength_factor: 1.0                # PLACEHOLDER calibration until CFD / flight data
    core_radius: 0.006                  # m, ~0.1 x canard span
    roll_lag: true
  # Share of the slender-body body carry-over load (k_B(W) = 0.50 for these canards) that a deflected
  # canard really puts on the body: 1 = sealed root, 0 = large hinge gap. PLACEHOLDER until wind tunnel /
  # flight data; it sets the canard pitch/yaw authority within about +-20 % (no effect on roll).
  canard_body_carryover: 0.5

# Canard servos (one per canard) - all values are PLACEHOLDERS until bench tests of the real servo.
actuators:
  canards:
    model: servo                        # ideal | servo
    limit_deg: 15.0
    natural_frequency_hz: 15.0          # from a small-step response test
    damping_ratio: 0.7
    stiffness: 40.0                     # N m/rad, hang a known torque on the canard, measure the deflection
    stall_torque: 1.5                   # N m (datasheet)
    max_rate_dps: 500.0                 # datasheet no-load speed (0.12 s / 60 deg)
    deadband_deg: 0.1                   # datasheet deadband (us) x deg/us
    resolution_deg: 0.09                # PWM timer resolution (1 us at ~0.09 deg/us)
    backlash_deg: 0.2                   # free play servo horn -> canard
    hinge_from_root_le: null            # null = canard planform centroid (54 mm aft of the root LE)

# Flight-computer sensors - datasheet-class PLACEHOLDER values. Disable any with enabled: false.
sensors:
  seed: 0
  imu:
    - name: imu0                        # ICM-42688-class
      station: 1.015                    # avionics bay plate
      rate_hz: 500
      accel: {range_g: 16, bits: 16, noise_density_ug_rthz: 70, bias_sigma_mg: 20, scale_factor_sigma_pct: 0.5,
              misalignment_sigma_deg: 0.5}
      gyro: {range_dps: 2000, bits: 16, noise_density_mdps_rthz: 2.8, bias_sigma_dps: 0.5, scale_factor_sigma_pct: 0.5,
             misalignment_sigma_deg: 0.5, g_sensitivity_dps_per_g: 0.1}
    - name: imu1                        # BMI088-class
      station: 1.015
      offset_yz_m: [0.02, 0.0]
      rate_hz: 500
      accel: {range_g: 24, bits: 16, noise_density_ug_rthz: 175, bias_sigma_mg: 20, scale_factor_sigma_pct: 0.5,
              misalignment_sigma_deg: 0.5}
      gyro: {range_dps: 2000, bits: 16, noise_density_mdps_rthz: 14, bias_sigma_dps: 1.0, scale_factor_sigma_pct: 0.5,
             misalignment_sigma_deg: 0.5, g_sensitivity_dps_per_g: 0.1}
  baro:                                 # MS5611-class
    station: 1.02
    rate_hz: 50
    noise_pa: 2.0
    bias_sigma_pa: 100.0
    resolution_pa: 1.2
    lag_s: 0.02
    static_error_coeff: 0.0             # depends on the vent holes - fit from flight data
  gnss:                                 # u-blox M10-class; not certain to fly
    enabled: false
    station: 1.00
    rate_hz: 10
    latency_s: 0.1
    max_accel_g: 4.0
    reacquire_s: 1.0

disturbances:
  thrust_misalignment_deg: [0.0, 0.0]
  thrust_offset_m: [0.0, 0.0]
  fin_misalignment_deg: {}

controller:
  type: none                            # a name from rocket_dt/controllers/__init__.py (see vertical_hold.yaml)

simulation:
  dt: 0.002
  t_max: 300.0
  stop_at: ground
  log_dt: 0.01
  pad_time_s: 5.0                       # sensors + controller run on the pad first (calibration)

montecarlo:
  n_runs: 50
  seed: 1
  dispersions:
    environment.wind.speed: {dist: uniform, low: 0.0, high: 6.0}
    environment.wind.direction_from_deg: {dist: uniform, low: 0.0, high: 360.0}
    launch.angle_from_vertical_deg: {dist: normal, mean: 0.0, sigma: 1.0}
    disturbances.thrust_misalignment_deg.0: {dist: normal, mean: 0.0, sigma: 0.15}
    disturbances.thrust_misalignment_deg.1: {dist: normal, mean: 0.0, sigma: 0.15}
    disturbances.thrust_scale: {dist: normal, mean: 1.0, sigma: 0.03}
    disturbances.drag_scale: {dist: normal, mean: 1.0, sigma: 0.05}
    aero.canard_vortex.strength_factor: {dist: uniform, low: 0.5, high: 1.5}
    aero.canard_body_carryover: {dist: uniform, low: 0.0, high: 1.0}
    disturbances.fin_misalignment_deg.motor case transition/Trapezoidal Fin Set: {dist: normal, mean: 0.0, sigma: 0.2, size: 4}
    disturbances.fin_misalignment_deg.canards bay body/Trapezoidal Fin Set: {dist: normal, mean: 0.0, sigma: 0.1, size: 4}
